<!-- HTML5 Document Declaration - tells browser this is an HTML5 page -->
<!doctype html>
<html>
<head>

  <!-- Viewport meta tag: makes page responsive on mobile devices -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Page title - appears in browser tab -->

  <!-- Start of CSS styling -->
  <style>
    /* General body styling */
    body { 
      margin: 0; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      color: #333;
      background: #f8f9fa; 
    }
    
    /* Main container that holds all content - centered with max width of 900px */
    #container {
      max-width: 900px;
      width: calc(100% - 40px);
      margin: 20px auto;
      border-radius: 20px;
      background-color: #fff;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    
    /* Link styling */
    a { 
      text-decoration: none;
      color: #0050e7;
      transition: color 0.2s ease;
    }
    a:visited { 
      color: #0050e7; 
    }
    a:hover { 
      text-decoration: underline;
      color: #0040b8;
    }

    /* Tab navigation bar styling */
    .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 28px; padding-bottom: 10px; border-bottom: 1px solid #e5e5e5; }
    
    /* Individual tab button styling */
    .tab-btn { 
      border: 1px solid #e0e0e0; 
      background: #f8f9fa; 
      padding: 10px 18px; 
      border-radius: 12px; 
      cursor: pointer;

      font-weight: 500;

      color: #555;

    .tab-btn:hover {
      background: #fff;
      border-color: #0050e7;
      color: #0050e7;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,80,231,0.15);

    /* Active tab button styling (the currently selected tab) */
    .tab-btn.active { 
      background: #0050e7; 
      border-color: #0050e7; 
      color: #fff;
      font-weight: 600; 
      box-shadow: 0 4px 12px rgba(0,80,231,0.25);

    /* Publications list - two-column layout */
    .publications-list {

    .publication-item {

    /* Patents list - two-column layout */
    .patents-list {

    .patent-item {

    /* Image modal (lightbox) */
    .image-modal { display: none; position: fixed; inset: 0; z-index: 9999; align-items: center; justify-content: center; }
    .image-modal.open { display: flex; }
    .image-modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
    .image-modal-content { position: relative; max-width: 90vw; max-height: 90vh; z-index: 2; display:flex; flex-direction:column; align-items:center; }

    .image-modal-close { position: absolute; right: -8px; top: -8px; background:#fff; border-radius:50%; border:none; width:32px; height:32px; font-size:18px; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,0.2); }

    /* Footer styling */

<body>
  <!-- Main container for all content -->
  <div id="container">

    <!-- Your name - main heading -->
    <h1>Abhijit Bendale</h1>
    
    <!-- Contact information and quick links -->
    <p>
      <a href="mailto:abhijitbendale@gmail.com">abhijitbendale@gmail.com</a>
      &nbsp;|&nbsp; <a href="https://github.com/abhijitbendale">GitHub</a>
      &nbsp;|&nbsp; <a href="https://www.linkedin.com/in/abhijit-bendale-8175175/">LinkedIn</a>
      &nbsp;|&nbsp; <a href="assets/bendale-resume-2026.pdf">Resume (PDF)</a>
    </p>

    <!-- Navigation tabs - clicking these shows different sections -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="about">About Me</button>
      <button class="tab-btn" data-tab="media">Projects / Media</button>
      <button class="tab-btn" data-tab="publications">Patents / Publications</button>

  <!-- Image modal (lightbox) -->
  <div id="image-modal" class="image-modal" aria-hidden="true">
    <div class="image-modal-backdrop" data-role="backdrop"></div>
    <div class="image-modal-content">
      <button class="image-modal-close" aria-label="Close">×</button>
      <img id="image-modal-img" src="" alt="" />
      <div id="image-modal-caption" class="image-modal-caption"></div>
    </div>
  </div>

  <!-- JavaScript for dynamic page loading -->
  <script>
    // Get all tab buttons and content container
    const buttons = document.querySelectorAll(".tab-btn");
    const contentContainer = document.getElementById("content");
    const PROJECTS_DATA_PATH = "assets/projects/projects-data.json";
    const MEDIA_BASE_PATH = "assets/projects/";
    const mediaState = { entries: [] };

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function projectPath(path) {
      if (!path) return "";
      const normalized = path.trim();
      if (/^(https?:)?\/\//i.test(normalized) || normalized.startsWith("/")) return normalized;
      if (normalized.startsWith("assets/")) return normalized;
      return `${MEDIA_BASE_PATH}${normalized.replace(/^\.\//, "")}`;
    }

    function parseManifest(markdownText) {
      return markdownText
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.startsWith("- "))
        .map(line => line.slice(2).trim())
        .filter(line => line.endsWith(".md"));
    }

    function parseProjectMetadata(markdownText) {
      const data = {};
      const lines = markdownText.split("\n");
      let start = 0;

      // Supports optional YAML frontmatter and simple key:value format.
      if (lines[0] && lines[0].trim() === "---") {
        const end = lines.findIndex((line, index) => index > 0 && line.trim() === "---");
        if (end > 0) {
          const fmLines = lines.slice(1, end);
          fmLines.forEach(line => {
            const parts = line.split(":");
            if (parts.length < 2) return;
            const key = parts.shift().trim().toLowerCase().replace(/^#+\s*/, "");
            const value = parts.join(":").trim();
            data[key] = value;
          });
          start = end + 1;
        }
      }

      if (Object.keys(data).length === 0) {
        lines.slice(start).forEach(line => {
          const parts = line.split(":");
          if (parts.length < 2) return;
          const key = parts.shift().trim().toLowerCase().replace(/^#+\s*/, "");
          const value = parts.join(":").trim();
          if (value) data[key] = value;
        });
      }

      return {
        title: data.title || "Untitled",
        date: data.date || "",
        group: data.group || "",
        image: data["title image"] || data.image || "",
        excerpt: data["representative text"] || data.excerpt || "",
        readMore: data["read more"] || ""
      };
    }

    function parseProjectDate(dateValue) {
      if (!dateValue) return Number.NEGATIVE_INFINITY;
      const ts = Date.parse(dateValue);
      return Number.isNaN(ts) ? Number.NEGATIVE_INFINITY : ts;
    }

    function formatInlineMarkdown(text) {
      let html = escapeHtml(text);
      html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\[(.+?)\]\((.+?)\)/g, (_match, label, href) => {
        const url = projectPath(href.trim());
        return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
      });
      return html;
    }

    function markdownToHtml(markdownText) {
      const lines = markdownText.split("\n");
      const out = [];
      let inList = false;

      for (const rawLine of lines) {
        const line = rawLine.trim();

        if (!line) {
          if (inList) {
            out.push("</ul>");
            inList = false;
          }
          continue;
        }

        if (line.startsWith("## ")) {
          if (inList) {
            out.push("</ul>");
            inList = false;
          }
          out.push(`<h2>${formatInlineMarkdown(line.slice(3))}</h2>`);
          continue;
        }

        if (line.startsWith("### ")) {
          if (inList) {
            out.push("</ul>");
            inList = false;
          }
          out.push(`<h3>${formatInlineMarkdown(line.slice(4))}</h3>`);
          continue;
        }

        if (line.startsWith("# ")) {
          if (inList) {
            out.push("</ul>");
            inList = false;
          }
          out.push(`<h1>${formatInlineMarkdown(line.slice(2))}</h1>`);
          continue;
        }

        if (line.startsWith("- ")) {
          if (!inList) {
            out.push("<ul>");
            inList = true;
          }
          out.push(`<li>${formatInlineMarkdown(line.slice(2))}</li>`);
          continue;
        }

        const imageMatch = line.match(/^!\[.*?\]\((.+?)\)$/);
        if (imageMatch) {
          if (inList) {
            out.push("</ul>");
            inList = false;
          }
          out.push(`<img class="clickable-thumb" src="${escapeHtml(projectPath(imageMatch[1].trim()))}" alt="Blog image" loading="lazy">`);
          continue;
        }

        if (inList) {
          out.push("</ul>");
          inList = false;
        }
        out.push(`<p>${formatInlineMarkdown(line)}</p>`);
      }

      if (inList) out.push("</ul>");
      return out.join("\n");
    }

    async function fetchText(path) {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) throw new Error(`Failed to load ${path}`);
      return response.text();
    }

    function renderMediaCards(entries) {
      const root = contentContainer.querySelector("[data-media-root]");
      if (!root) return;

      const groupedEntries = new Map();
      entries.forEach(entry => {
        const groupName = (entry.group || "Other Projects").trim();
        if (!groupedEntries.has(groupName)) groupedEntries.set(groupName, []);
        groupedEntries.get(groupName).push(entry);
      });

      const sectionsHtml = Array.from(groupedEntries.entries()).map(([groupName, groupItems]) => {
        const cardsHtml = groupItems.map(entry => {
        const teaserSrc = projectPath(entry.image);
        const isInternalPost = entry.readMore.endsWith(".md");
        const readMoreHtml = isInternalPost
          ? `<button class="media-card__readmore" data-post="${encodeURIComponent(entry.readMore)}">[ READ MORE ]</button>`
          : `<a class="media-card__readmore" href="${escapeHtml(entry.readMore)}" target="_blank" rel="noopener noreferrer">[ READ MORE ]</a>`;

        return `
          <article class="media-card">
            <div class="media-card__teaser">
              <img class="clickable-thumb" src="${escapeHtml(teaserSrc)}" alt="${escapeHtml(entry.title)}" loading="lazy">
            </div>
            <div class="media-card__content">
              <h3 class="media-card__title">${escapeHtml(entry.title)}</h3>
              <p class="media-card__excerpt">${escapeHtml(entry.excerpt)}</p>
              ${readMoreHtml}
            </div>
          </article>
        `;
      }).join("\n");

        return `
          <section class="media-group">
            <h3 class="media-group-title">${escapeHtml(groupName)}</h3>
            <div class="media-list">${cardsHtml}</div>
          </section>
        `;
      }).join("\n");

      root.innerHTML = sectionsHtml;

      root.querySelectorAll("[data-post]").forEach(button => {
        button.addEventListener("click", async () => {
          const postFile = decodeURIComponent(button.getAttribute("data-post"));
          await renderMediaPost(postFile);
        });
      });
      setupImageLightbox();
    }

    async function renderMediaPost(postFile) {
      const root = contentContainer.querySelector("[data-media-root]");
      if (!root) return;
      root.innerHTML = `<p class="media-status">Loading post...</p>`;

      try {
        const markdown = await fetchText(projectPath(postFile));
        const postHtml = markdownToHtml(markdown);
        root.innerHTML = `
          <button class="media-back-btn" type="button">[ BACK ]</button>
          <article class="media-post">${postHtml}</article>
        `;
        root.querySelector(".media-back-btn").addEventListener("click", () => {
          renderMediaCards(mediaState.entries);
        });
        setupImageLightbox();
      } catch (error) {
        console.error(error);
        root.innerHTML = `<p class="media-status">Failed to load this post.</p>`;
      }
    }

    async function initializeMediaPage() {
      const root = contentContainer.querySelector("[data-media-root]");
      if (!root) return;

      root.innerHTML = `<p class="media-status">Loading projects...</p>`;

      try {
        const jsonText = await fetchText(PROJECTS_DATA_PATH);
        const entries = JSON.parse(jsonText);
        if (!Array.isArray(entries)) {
          throw new Error("Invalid project data");
        }

        entries.sort((a, b) => {
          const dateDiff = parseProjectDate(b.date) - parseProjectDate(a.date);
          if (dateDiff !== 0) return dateDiff;
          return (a.__manifestOrder ?? 0) - (b.__manifestOrder ?? 0);
        });

        mediaState.entries = entries;
        if (entries.length === 0) {
          root.innerHTML = `<p class="media-status">No project cards available yet.</p>`;
          return;
        }
        renderMediaCards(entries);
      } catch (jsonError) {
        console.warn("Failed to load project data JSON, falling back to markdown manifest", jsonError);

        try {
          const manifestText = await fetchText("assets/projects/projects-index.md");
          const files = parseManifest(manifestText);

          const filePromises = files.map(async (file, index) => {
            try {
              const metadataText = await fetchText(projectPath(file));
              const metadata = parseProjectMetadata(metadataText);
              if (!metadata.title || !metadata.image || !metadata.excerpt || !metadata.readMore) {
                console.warn(`Skipping incomplete project metadata: ${file}`);
                return null;
              }
              return { ...metadata, __manifestOrder: index };
            } catch (error) {
              console.warn(`Skipping unreadable project metadata file: ${file}`, error);
              return null;
            }
          });

          const settledResults = await Promise.all(filePromises);
          const entries = settledResults.filter(Boolean);

          entries.sort((a, b) => {
            const dateDiff = parseProjectDate(b.date) - parseProjectDate(a.date);
            if (dateDiff !== 0) return dateDiff;
            return a.__manifestOrder - b.__manifestOrder;
          });

          mediaState.entries = entries;
          if (entries.length === 0) {
            root.innerHTML = `<p class="media-status">No project cards available yet.</p>`;
            return;
          }
          renderMediaCards(entries);
        } catch (error) {
          console.error(error);
          root.innerHTML = `<p class="media-status">Unable to load project cards. Please try again.</p>`;
        }
      }
    }

    // Function to load content from a specific page
    function loadContent(tabId) {
      // Update active button styling
      buttons.forEach(b => b.classList.toggle("active", b.dataset.tab === tabId));

      // Fetch the content from the pages directory
      const contentPromise = tabId === "publications"
        ? Promise.all([
            fetch("pages/publications.html").then(response => {
              if (!response.ok) {
                throw new Error("Failed to load publications.html");
              }
              return response.text();
            }),
            fetch("pages/patents.html").then(response => {
              if (!response.ok) {
                throw new Error("Failed to load patents.html");
              }
              return response.text();
            })
          ]).then(([publicationsHtml, patentsHtml]) => `${publicationsHtml}\n${patentsHtml}`)
        : fetch(`pages/${tabId}.html`).then(response => {
            if (!response.ok) {
              throw new Error(`Failed to load ${tabId}.html`);
            }
            return response.text();
          });

      contentPromise
        .then(html => {
          // Insert the HTML content into the container
          contentContainer.innerHTML = html;
          if (tabId === "media") {
            initializeMediaPage();
          }
          // Initialize image lightbox for loaded content
          setupImageLightbox();
        })
        .catch(error => {
          console.error(error);
          contentContainer.innerHTML = `<p>Error loading content. Please try again.</p>`;
        });
      
      // Update the URL hash to remember which tab was selected
      history.replaceState(null, "", "#" + tabId);
    }

    // Add click listeners to all tab buttons
    buttons.forEach(btn => {
      btn.addEventListener("click", () => loadContent(btn.dataset.tab));
    });

    // When page loads, load the tab from the URL hash or default to 'about'
    const validTabs = new Set(["about", "publications", "media"]);
    const legacyTabMap = { patents: "publications", experience: "about" };
    const hashTab = (location.hash || "#about").slice(1);
    const initialTab = validTabs.has(hashTab)
      ? hashTab
      : (legacyTabMap[hashTab] || "about");
    // Use setTimeout to ensure page layout is complete before loading
    setTimeout(() => loadContent(initialTab), 100);

    // Image lightbox setup: attach click handlers to images with class 'clickable-thumb'
    function setupImageLightbox() {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('image-modal-img');
      const modalCaption = document.getElementById('image-modal-caption');
      const closeBtn = modal.querySelector('.image-modal-close');

      function hideModal() {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        modalImg.src = '';
      }

      if (modal.dataset.lightboxInitialized !== 'true') {
        closeBtn.addEventListener('click', hideModal);
        modal.querySelector('[data-role="backdrop"]').addEventListener('click', hideModal);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideModal(); });
        modal.dataset.lightboxInitialized = 'true';
      }

      function showModal(src, alt) {
        modalImg.src = src;
        modalImg.alt = alt || '';
        modalCaption.textContent = alt || '';
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
      }

      const imgs = contentContainer.querySelectorAll('.clickable-thumb');
      imgs.forEach(img => {
        if (img.dataset.lightboxBound === 'true') return;
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', () => {
          showModal(img.src, img.alt || '');
        });
        img.dataset.lightboxBound = 'true';
      });
    }
  </script>
</body>
