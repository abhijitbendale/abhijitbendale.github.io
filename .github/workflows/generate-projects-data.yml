name: Generate project metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: []

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Generate projects metadata
        run: python3 scripts/generate_projects_data.py

      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects/projects-data.json
          if git diff --cached --quiet --exit-code; then
            echo "No generated changes"
          else
            git commit -m "Auto-generate project metadata JSON"
            git push origin HEAD:main
          fi
